<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betting Alerts — Logged Bets</title>
<style>
  :root {
    --bg: #0f1216; --card: #1a1f26; --line: #2a313b; --fg: #e8edf2;
    --muted: #8b97a6; --accent: #4ea1ff; --good: #37c978; --warn: #f0b429;
    --danger: #ef5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.45 -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--fg); padding: 16px; max-width: 860px;
    margin-inline: auto;
  }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; }
  .stage {
    font-size: 11px; font-weight: 700; letter-spacing: .5px; padding: 2px 8px;
    border-radius: 999px; background: var(--warn); color: #1a1f26;
  }
  nav.tabs { margin: 4px 0 16px; }
  nav.tabs a {
    color: var(--muted); text-decoration: none; font-size: 13px; margin-right: 16px;
    border-bottom: 2px solid transparent; padding-bottom: 4px;
  }
  nav.tabs a.active { color: var(--fg); border-color: var(--accent); }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0 16px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters select, .filters input {
    padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-size: 13px;
  }
  .summary { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; min-width: 100px; }
  .stat .n { font-size: 20px; font-weight: 700; }
  .stat .l { font-size: 11px; color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 10px;
  }
  .fav { font-size: 16px; font-weight: 700; }
  .sport { display: inline-block; font-size: 11px; font-weight: 700;
           letter-spacing: .06em; padding: 2px 7px; border-radius: 4px;
           vertical-align: 2px; margin-right: 6px; }
  .sport-nba { background: #1d3f73; color: #dce9ff; }
  .sport-cfb { background: #6b3410; color: #ffe6d0; }
  .ml { color: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px;
    color: var(--muted); font-size: 13px; }
  .row b { color: var(--fg); font-weight: 600; }
  .placed { color: var(--good); }
  .skipped { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  footer { color: var(--muted); font-size: 11px; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Logged Bets</h1>
  <span class="stage" id="stage">PAPER</span>
</header>
<nav class="tabs">
  <a href="index.html">Survivors</a>
  <a href="bets.html" class="active">Logged Bets</a>
</nav>
<p class="note">
  Everything you've logged from the Survivors page — placed bets and
  deliberate skips alike. Read-only; edit rows directly in Supabase if needed.
</p>

<div class="filters">
  <select id="sportFilter">
    <option value="">All sports</option>
    <option value="cfb">CFB</option>
    <option value="nba">NBA</option>
  </select>
  <select id="placedFilter">
    <option value="">Placed + skipped</option>
    <option value="true">Placed only</option>
    <option value="false">Skipped only</option>
  </select>
</div>

<div class="summary" id="summary"></div>
<div id="list"><p class="empty">Loading…</p></div>
<footer id="foot"></footer>

<script src="config.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
const listEl = document.getElementById("list");
const footEl = document.getElementById("foot");
const summaryEl = document.getElementById("summary");
const sportFilter = document.getElementById("sportFilter");
const placedFilter = document.getElementById("placedFilter");

document.getElementById("stage").textContent = (CFG.STAGE || "paper").toUpperCase();

function rest(path, opts = {}) {
  const headers = Object.assign({
    apikey: CFG.SUPABASE_ANON_KEY,
    Authorization: "Bearer " + CFG.SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
  }, opts.headers || {});
  return fetch(CFG.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/" + path,
               Object.assign({}, opts, { headers }));
}

function fmtMl(ml) { return ml > 0 ? "+" + ml : String(ml); }
function fmtTime(iso) {
  try { return new Date(iso).toLocaleString(); } catch { return iso; }
}

let allBets = [];

function card(b) {
  const el = document.createElement("div");
  el.className = "card";
  const sportKey = (b.sport || "").toLowerCase();
  const sportLabel = sportKey ? sportKey.toUpperCase() : "?";
  const sportClass = (sportKey === "nba" || sportKey === "cfb") ? "sport-" + sportKey : "";
  const liq = (b.liquidity != null) ? "$" + Number(b.liquidity).toLocaleString() : "n/a";
  const stakeLabel = b.placed
    ? `<span class="placed">$${Number(b.stake_chosen).toLocaleString()} placed</span>`
    : `<span class="skipped">Skipped (no bet)</span>`;
  el.innerHTML = `
    <div class="fav"><span class="sport ${sportClass}">${sportLabel}</span>${b.favorite} <span class="ml">${fmtMl(b.entry_ml)}</span></div>
    <div class="row"><span>Underdog</span><b>${b.dog}</b></div>
    <div class="row"><span>Logged at</span><b>${fmtTime(b.entry_time_actual)}</b></div>
    <div class="row"><span>Liquidity</span><b>${liq}</b></div>
    <div class="row"><span>Stake</span>${stakeLabel}</div>`;
  return el;
}

function render() {
  const sport = sportFilter.value;
  const placed = placedFilter.value;
  let rows = allBets;
  if (sport) rows = rows.filter(b => (b.sport || "").toLowerCase() === sport);
  if (placed) rows = rows.filter(b => String(!!b.placed) === placed);

  listEl.innerHTML = "";
  if (!rows.length) {
    listEl.innerHTML = `<p class="empty">No logged bets match this filter.</p>`;
  } else {
    rows.forEach(b => listEl.appendChild(card(b)));
  }

  const placedCount = rows.filter(b => b.placed).length;
  const skippedCount = rows.length - placedCount;
  const totalStaked = rows.reduce((sum, b) => sum + (b.placed ? Number(b.stake_chosen) || 0 : 0), 0);
  summaryEl.innerHTML = `
    <div class="stat"><div class="n">${rows.length}</div><div class="l">total logged</div></div>
    <div class="stat"><div class="n">${placedCount}</div><div class="l">placed</div></div>
    <div class="stat"><div class="n">${skippedCount}</div><div class="l">skipped</div></div>
    <div class="stat"><div class="n">$${totalStaked.toLocaleString()}</div><div class="l">total staked</div></div>`;

  footEl.textContent = `${rows.length} of ${allBets.length} bets shown · updated ${new Date().toLocaleTimeString()}`;
}

async function load() {
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) {
    listEl.innerHTML = `<p class="empty err">Config missing. Copy
      docs/config.example.js to docs/config.js and fill in the anon key + URL.</p>`;
    return;
  }
  try {
    const r = await rest("bets?order=entry_time_actual.desc");
    if (!r.ok) throw new Error("HTTP " + r.status);
    allBets = await r.json();
    render();
  } catch (e) {
    listEl.innerHTML = `<p class="empty err">Could not load bets: ${e.message}</p>`;
  }
}

sportFilter.addEventListener("change", render);
placedFilter.addEventListener("change", render);
load();
</script>
</body>
</html>
