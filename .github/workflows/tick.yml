# Rolling tick (Design B §12.3 / §12.7) — the app's heartbeat.
#
# Appends a fresh odds snapshot and alerts survivors ~1:55 before tip. All state
# lives in the hosted DB, so every run is idempotent and self-healing. Cron is
# UTC; the NBA active window (ET 14:00–24:00) is ~UTC 19:00 through 05:00, so we
# poll every 5 minutes across that band. run_tick itself skips games that aren't
# in their alert window, so off-slate ticks are cheap.
name: tick
on:
  schedule:
    # Overnight hourly (5 snapshots): 10pm/11pm ET prev day, 12am/1am/2am ET game day
    - cron: "0 3-7 * * *"      # UTC 03:00, 04:00, 05:00, 06:00, 07:00
    # Dense half-hour (23 snapshots): 8:00am–7:00pm ET game day, every 30 min
    - cron: "0,30 13-23 * * *"  # UTC 13:00 through 23:30, on the hour and half-hour
    - cron: "0 0 * * *"         # UTC 00:00 = 7:00pm ET (final dense snapshot)
  workflow_dispatch:
    inputs:
      force_sample:
        description: "Send a synthetic [SMOKE TEST] alert via SendGrid instead of running the tick (proves CI secrets + email path)"
        type: boolean
        default: false

concurrency:
  group: tick                   # never overlap ticks
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: force sample alert (smoke test)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_sample }}
        env:
          # DB-free path: only the email + push config is needed — no Supabase / Odds keys.
          EMAILAPIKEY: ${{ secrets.EMAILAPIKEY }}
          STAGE: ${{ vars.STAGE }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          STAKE_TARGET: ${{ vars.STAKE_TARGET }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python -m engine.alert --smoke
      - name: run tick
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_sample) }}
        env:
          ODDSAPIKEY: ${{ secrets.ODDSAPIKEY }}
          SUPABASEURL: ${{ secrets.SUPABASEURL }}
          SUPABASEKEY: ${{ secrets.SUPABASEKEY }}
          EMAILAPIKEY: ${{ secrets.EMAILAPIKEY }}
          # Non-secret runtime config (GitHub Actions Variables, not Secrets):
          STAGE: ${{ vars.STAGE }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          STAKE_TARGET: ${{ vars.STAKE_TARGET }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python -m engine.tick
