# Daily point-in-time stats pull (Design B §12.6 / §12.7).
#
# Once a day, before the slate, pull each team's stats as of the sport's own
# as-of boundary (no lookahead) and upsert them into the `stats` table so the
# tick never touches nba_api / CFBD on every poll. Runs at UTC 16:00
# (ET ~11:00-12:00), comfortably before first tip.
#
# The two sports run as independent matrix legs so a CFBD outage cannot stop the
# NBA pull, or vice versa:
#   nba  as of D-1 (the prior calendar day).
#   cfb  as of the end of the last COMPLETED week (endWeek = N-1 for a week-N
#        game), garbage time excluded. Running this daily is idempotent — the
#        as-of key only advances when a week actually ends.
name: daily-stats
on:
  schedule:
    - cron: "0 16 * * *"        # UTC 16:00  (ET 11:00 EST / 12:00 EDT)
  workflow_dispatch:
    inputs:
      asof_date:
        description: "Override as-of date (YYYY-MM-DD); default = yesterday ET"
        required: false
      sport:
        description: "Limit the run to one sport (blank = both)"
        required: false
        type: choice
        options: ["", "nba", "cfb"]
        default: ""

jobs:
  daily-stats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one sport's data source failing must not
      matrix:                   # suppress the other's pull
        sport: [nba, cfb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pull PIT stats (${{ matrix.sport }})
        if: ${{ inputs.sport == '' || inputs.sport == matrix.sport }}
        env:
          SUPABASEURL: ${{ secrets.SUPABASEURL }}
          SUPABASEKEY: ${{ secrets.SUPABASEKEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ASOF_DATE: ${{ inputs.asof_date }}
        run: |
          if [ -n "$ASOF_DATE" ]; then
            python -m engine.daily_stats --sport "${{ matrix.sport }}" --asof-date "$ASOF_DATE"
          else
            python -m engine.daily_stats --sport "${{ matrix.sport }}"
          fi
