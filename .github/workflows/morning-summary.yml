# Morning settle + summary (Design B §12.6 / §12.7).
#
# Each morning: grade yesterday's logged bets and record how the vetoed games
# turned out (settle.py), then email the record + P&L + veto audit (summary.py).
# Runs at UTC 14:00 (ET ~09:00), after all prior-night games are final.
#
# One leg per sport, so NBA and CFB are settled and summarized independently and
# arrive as separate, sport-tagged emails. fail-fast is off: a problem grading
# one sport must not stop the other from being settled and reported.
name: morning-summary
on:
  schedule:
    - cron: "0 14 * * *"        # UTC 14:00  (ET 09:00 EST / 10:00 EDT)
  workflow_dispatch:
    inputs:
      sport:
        description: "Limit the run to one sport (blank = both)"
        required: false
        type: choice
        options: ["", "nba", "cfb"]
        default: ""

jobs:
  morning-summary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sport: [nba, cfb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: settle yesterday's bets (${{ matrix.sport }})
        if: ${{ inputs.sport == '' || inputs.sport == matrix.sport }}
        env:
          ODDSAPIKEY: ${{ secrets.ODDSAPIKEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SUPABASEURL: ${{ secrets.SUPABASEURL }}
          SUPABASEKEY: ${{ secrets.SUPABASEKEY }}
        run: python -m engine.settle --sport "${{ matrix.sport }}"
      - name: email the summary (${{ matrix.sport }})
        if: ${{ inputs.sport == '' || inputs.sport == matrix.sport }}
        env:
          SUPABASEURL: ${{ secrets.SUPABASEURL }}
          SUPABASEKEY: ${{ secrets.SUPABASEKEY }}
          EMAILAPIKEY: ${{ secrets.EMAILAPIKEY }}
          STAGE: ${{ vars.STAGE }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: python -m engine.summary --sport "${{ matrix.sport }}"
